name: CI

on:
  push:
  pull_request:


concurrency:
  group: residual-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest==9.1.1 jsonschema==4.26.0
      - run: pytest -q
      - run: python src/gate.py examples/residual-act.json
      - run: python src/eval.py examples/paired-eval.json
