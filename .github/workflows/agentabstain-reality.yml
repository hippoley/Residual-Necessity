name: AgentAbstain reality

on:
  push:
  pull_request:
  workflow_dispatch:


concurrency:
  group: residual-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  blind-runtime-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Download external AgentAbstain dataset
        run: |
          curl -fL             https://huggingface.co/datasets/antiquality/agentabstain/resolve/842228426c2a703347396501af61c7890972c7ee/tasks.jsonl             -o /tmp/agentabstain-tasks.jsonl
          test -s /tmp/agentabstain-tasks.jsonl
      - name: Build gold-hidden runtime slice
        run: |
          python experiments/agentabstain/prepare_runtime_blind_slice.py             /tmp/agentabstain-tasks.jsonl             --blind-out /tmp/runtime-blind.json             --labels-out /tmp/runtime-labels.json             | tee /tmp/runtime-summary.json
      - name: Inspect blind runtime shape
        run: python experiments/agentabstain/inspect_blind_shape.py /tmp/runtime-blind.json

      - name: Audit static pair equivalence
        run: |
          python benchmark/audit_agentabstain_static_pair_equivalence.py \
            /tmp/runtime-blind.json \
            --out /tmp/runtime-static-pair-equivalence.json
          python - <<'PY'
          import json
          report=json.load(open("/tmp/runtime-static-pair-equivalence.json"))
          assert report["pair_count"] == 97
          assert report["differing_pair_count"] == 0
          assert report["static_pair_equivalence_pass"] is True
          print("STATIC_PAIR_EQUIVALENCE=PASS")
          PY

      - name: Freeze gold-free development holdout split
        run: |
          python experiments/agentabstain/freeze_pair_split.py \
            /tmp/runtime-blind.json \
            --out /tmp/runtime-pair-split.json
          sha256sum /tmp/runtime-pair-split.json | tee /tmp/runtime-pair-split.sha256

      - name: Audit hidden-category split coverage
        run: |
          python benchmark/audit_agentabstain_split.py \
            --labels /tmp/runtime-labels.json \
            --split /tmp/runtime-pair-split.json \
            --out /tmp/runtime-split-audit.json

      - name: Preserve Reality Gate split manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentabstain-pair-split
          path: |
            /tmp/runtime-pair-split.json
            /tmp/runtime-pair-split.sha256
            /tmp/runtime-split-audit.json
            /tmp/runtime-static-pair-equivalence.json
          if-no-files-found: error
      - name: Score preregistered trivial baselines
        run: |
          python experiments/agentabstain/baselines.py /tmp/runtime-labels.json | tee /tmp/runtime-baselines.json

      - name: Verify no gold fields leaked
        run: |
          python - <<'PY'
          import json
          rows = json.load(open("/tmp/runtime-blind.json"))
          forbidden = {
              "task_type", "abstention_trigger", "execution_dag",
              "critical_actions", "category", "transformation_dimension",
              "task_id"
          }
          assert rows, "expected non-empty runtime slice"
          for row in rows:
              assert forbidden.isdisjoint(row)
              assert "/" not in str(row["pair_id"]), "pair_id leaks category"
          print(f"BLIND_RUNTIME_VARIANTS={len(rows)}")
          PY


  tool-visible-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Checkout pinned AgentAbstain runtime
        run: |
          git clone https://github.com/AntiQuality/agentabstain.git /tmp/agentabstain
          cd /tmp/agentabstain
          git checkout cfc3faf7ab1cfd4892cde1158d6e43b2f312ddc3
          test "$(git rev-parse HEAD)" = "cfc3faf7ab1cfd4892cde1158d6e43b2f312ddc3"

      - name: Install minimal AgentAbstain sandbox dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML==6.0.3 pydantic==2.14.0 fastmcp==4.1.0 mcp==2.3.0 huggingface_hub==2.2.0

      - name: Download public AgentAbstain executable dataset
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi, snapshot_download
          revision = "842228426c2a703347396501af61c7890972c7ee"
          info = HfApi().dataset_info("antiquality/agentabstain", revision=revision)
          assert info.sha == revision, (info.sha, revision)
          print("AGENTABSTAIN_DATASET_SHA=", info.sha)
          path = snapshot_download(
              "antiquality/agentabstain",
              repo_type="dataset",
              revision=revision,
              local_dir="/tmp/agentabstain-data",
          )
          print("AGENTABSTAIN_DATA_DIR=", path)
          PY

      - name: Obtain one read-only runtime observation
        run: |
          python experiments/agentabstain/probe_runtime_observation.py \
            --agentabstain-root /tmp/agentabstain \
            --data-dir /tmp/agentabstain-data \
            --out /tmp/agentabstain-probe.json
          python - <<'PY'
          import json
          record = json.load(open("/tmp/agentabstain-probe.json"))
          assert record["tool_kind"] in {"lookup", "verify"}
          assert record["gold_fields_exposed_to_selector"] is False
          assert record["raw_state_exposed_to_selector"] is False
          assert record["selection_module"] == "blind_probe.py"
          assert record["trusted_harness_knows_variant"] is True
          assert record["selection_process_isolated"] is True
          assert isinstance(record["binding_complete"], bool)
          assert isinstance(record["unbound_fields"], list)
          if record["binding_complete"] is False:
              assert record["unbound_fields"], record
          assert "/" not in record["case_id"]
          print(json.dumps(record, indent=2, sort_keys=True))
          PY

      - name: Verify blind selector source isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("experiments/agentabstain/blind_probe.py").read_text()
          forbidden = {
              "AntiQuality", "agentabstain", "BaseAgent", "TaskBundle",
              "task_type", "execution_dag", "abstention_trigger",
              "critical_actions", "initial_states", "raw_state"
          }
          for token in forbidden:
              assert token not in source, token
          print("BLIND_SELECTOR_SOURCE_FIREWALL=PASS")
          PY

      - name: Preserve probe evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentabstain-tool-visible-probe
          path: /tmp/agentabstain-probe.json
          if-no-files-found: error

      - name: Run blinded runtime-evidence baselines
        run: |
          python experiments/agentabstain/probe_runtime_batch.py \
            --agentabstain-root /tmp/agentabstain \
            --data-dir /tmp/agentabstain-data \
            --tasks-jsonl /tmp/agentabstain-data/tasks.jsonl \
            --predictions-out /tmp/runtime-evidence-predictions.json \
            --labels-out /tmp/runtime-evidence-labels.json \
            --summary-out /tmp/runtime-evidence-summary.json \
            --development-observations-out /tmp/runtime-development-observations.json \
            --development-labels-out /tmp/runtime-development-labels.json

          python - <<'PY'
          import json
          predictions = json.load(open("/tmp/runtime-evidence-predictions.json"))
          assert predictions, "expected frozen predictions"
          forbidden = {
              "task_type", "abstention_trigger", "execution_dag",
              "critical_actions", "category", "transformation_dimension",
              "source_pair_id"
          }
          for row in predictions:
              assert forbidden.isdisjoint(row), row
              assert row["failure_only"] in {"ACT", "ABSTAIN", "INVESTIGATE"}
              assert row["probe_success"] in {"ACT", "ABSTAIN", "INVESTIGATE"}
              assert row["proposition_specific"] in {"ACT", "ABSTAIN", "INVESTIGATE"}
              assert isinstance(row["binding_complete"], bool)
              assert isinstance(row["unbound_fields"], list)
          print("RUNTIME_EVIDENCE_PREDICTIONS=", len(predictions))

          dev_obs = json.load(open("/tmp/runtime-development-observations.json"))
          dev_labels = json.load(open("/tmp/runtime-development-labels.json"))
          assert len(dev_obs) == len(dev_labels) == 128, (len(dev_obs), len(dev_labels))
          assert {row["case_id"] for row in dev_obs} == {row["case_id"] for row in dev_labels}
          for row in dev_obs:
              assert "task_type" not in row
              assert "category" not in row
              assert "abstention_trigger" not in row
          print("DEVELOPMENT_VARIANTS_EXPORTED=", len(dev_obs))
          print("HOLDOUT_OBSERVATION_PAYLOAD_EXPORTED=false")
          PY

      - name: Profile development-only observations
        run: |
          python experiments/agentabstain/summarize_development_observations.py \
            --observations /tmp/runtime-development-observations.json \
            --labels /tmp/runtime-development-labels.json \
            --out /tmp/runtime-development-profile.json

      - name: Freeze proposition-provider profile registry
        run: |
          sha256sum experiments/agentabstain/probe_binding_profiles.json | tee /tmp/proposition-provider-profiles.sha256

      - name: Score proposition candidate on development only
        run: |
          python experiments/agentabstain/score_development_candidate.py \
            --predictions /tmp/runtime-evidence-predictions.json \
            --development-labels /tmp/runtime-development-labels.json \
            --out /tmp/runtime-development-candidate-score.json
          python - <<'PY'
          import json
          report = json.load(open("/tmp/runtime-development-candidate-score.json"))
          assert report["partition"] == "development"
          assert report["holdout_labels_consumed"] is False
          assert report["development_variants"] == 128
          assert report["development_pairs"] == 64
          expected_categories = {
              "critical_tool_failure",
              "conflicting_evidence",
              "emergent_risk_discovery",
          }
          assert set(report["by_category"]) == expected_categories, report["by_category"].keys()
          print("DEVELOPMENT_CANDIDATE_PAIRED_ACCURACY=", report["paired_accuracy"])
          print("DEVELOPMENT_CANDIDATE_ACT_RECALL=", report["act_recall"])
          print("DEVELOPMENT_CANDIDATE_ABSTAIN_RECALL=", report["abstain_recall"])
          print("DEVELOPMENT_CANDIDATE_DECISION_COVERAGE=", report["decision_coverage"])
          print("DEVELOPMENT_CANDIDATE_UNNECESSARY_INTERVENTION=", report["unnecessary_intervention_rate"])
          print("DEVELOPMENT_CANDIDATE_PAIR_OUTCOMES=", report["pair_outcomes"])
          PY

      - name: Freeze predictions before gold scoring
        run: |
          sha256sum /tmp/runtime-evidence-predictions.json | tee /tmp/runtime-evidence-predictions.sha256

      - name: Reveal labels and score runtime-evidence baselines
        run: |
          python experiments/agentabstain/score_runtime_baselines.py \
            --predictions /tmp/runtime-evidence-predictions.json \
            --labels /tmp/runtime-evidence-labels.json \
            --out /tmp/runtime-evidence-scores.json

      - name: Preserve runtime-evidence Reality Gate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentabstain-runtime-evidence-baselines
          path: |
            /tmp/runtime-evidence-predictions.json
            /tmp/runtime-evidence-predictions.sha256
            /tmp/runtime-evidence-summary.json
            /tmp/runtime-evidence-scores.json
            /tmp/runtime-development-observations.json
            /tmp/runtime-development-labels.json
            /tmp/runtime-development-profile.json
            /tmp/runtime-development-candidate-score.json
            /tmp/proposition-provider-profiles.sha256
          if-no-files-found: error
