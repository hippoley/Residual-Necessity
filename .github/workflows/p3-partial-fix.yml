name: P3 partial-fix reality

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: residual-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  normalize-real-partial-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Checkout pinned P3 dataset
        run: |
          git clone https://gitlab.com/sosy-lab/research/data/partial-fix-dataset.git /tmp/p3
          cd /tmp/p3
          git checkout bfd73658
          test "$(git rev-parse --short=8 HEAD)" = "bfd73658"

      - name: Install parser dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Normalize one curated real partial-fix sequence
        run: |
          python experiments/p3/normalize_partial_fix.py \
            /tmp/p3 \
            --p3-commit bfd73658 \
            --out /tmp/p3-partial-fix.json
          python - <<'PY'
          import json
          record = json.load(open("/tmp/p3-partial-fix.json"))
          assert record["classification"] == "partial fix"
          assert record["base_revision"]
          assert record["attempt_revisions"]
          assert record["expected_revision"]
          assert record["base_revision"] != record["expected_revision"]
          assert record["expected_revision"] not in record["attempt_revisions"]
          assert record["residual_semantics"]["intermediate_attempt_is_curated_incomplete_fix"] is True
          print(json.dumps(record, indent=2, sort_keys=True))
          PY

      - name: Freeze external partial-fix evidence
        run: sha256sum /tmp/p3-partial-fix.json | tee /tmp/p3-partial-fix.sha256

      - name: Preserve P3 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p3-real-partial-fix
          path: |
            /tmp/p3-partial-fix.json
            /tmp/p3-partial-fix.sha256
          if-no-files-found: error
