name: ACS end to end

on:
  pull_request:
  workflow_dispatch:


concurrency:
  group: residual-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Microsoft ACS Python SDK
        run: python -m pip install agent-control-specification==0.3.1b1

      - name: Run Residual Necessity through ACS native runtime
        run: python experiments/acs_e2e.py
