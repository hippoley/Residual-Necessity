name: Agent Hooks official CTK cross-contract

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: residual-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  official-ctk-and-interceptor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pinned official Agent Hooks CTK
        run: python -m pip install "agent-hooks-sdk[ctk]==0.1.0b1"

      - name: Run official CTK reference corpus plus RN interceptor seam
        run: |
          python experiments/agent_hooks_ctk_cross_contract.py \
            --sdk-version 0.1.0b1 \
            --out /tmp/agent-hooks-cross-contract.json

      - name: Assert claim boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open("/tmp/agent-hooks-cross-contract.json"))
          assert r["host_conformance_claimed"] is False
          assert r["claim_type"] == "interceptor_compatibility_not_host_conformance"
          assert not r["official_ctk_reference"]["failures"]
          assert all(x["pass"] for x in r["residual_necessity_interceptor"]["cases"])
          print("AGENT_HOOKS_CTK_CROSS_CONTRACT=PASS")
          PY

      - name: Preserve cross-contract evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-hooks-official-ctk-cross-contract
          path: /tmp/agent-hooks-cross-contract.json
          if-no-files-found: error
