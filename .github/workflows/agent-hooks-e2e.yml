name: Agent Hooks end to end

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: residual-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-control-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Agent Hooks beta SDK
        run: python -m pip install agent-hooks-sdk==0.1.0b1

      - name: Run Residual Necessity as an Agent Hooks interceptor
        run: python experiments/agent_hooks_e2e.py
