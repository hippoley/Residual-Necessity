name: SafeAct constraint interoperability

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: residual-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  safeact-real-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Checkout pinned SafeAct
        run: |
          git clone https://github.com/caoshidong66/safeact.git /tmp/safeact
          cd /tmp/safeact
          git checkout 841816cf1e376e6fbf8600cffac5df1736e1d369
          test "$(git rev-parse HEAD)" = "841816cf1e376e6fbf8600cffac5df1736e1d369"

      - name: Verify upstream licenses
        run: |
          grep -q "MIT License" /tmp/safeact/LICENSE
          grep -q "Creative Commons Attribution 4.0" /tmp/safeact/LICENSE-DATA

      - name: Run real SafeAct to RN constraint mapping
        run: |
          python experiments/safeact_e2e.py --safeact-root /tmp/safeact | tee /tmp/safeact-rn-e2e.txt
          grep -q '"external_safeact_consumed": true' /tmp/safeact-rn-e2e.txt
          grep -q '"support_never_promoted_to_necessity": true' /tmp/safeact-rn-e2e.txt

      - name: Preserve interoperability evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safeact-constraint-interoperability
          path: /tmp/safeact-rn-e2e.txt
          if-no-files-found: error
